<!DOCTYPE html>
<html>
<head>
    <title>Language Detector & Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>🌍 Language Detector + Translator</h2>

    <textarea id="inputText" placeholder="Enter any language text here..."></textarea>

    <button onclick="detectTranslate()">Detect & Translate</button>

    <div id="resultBox">
        <p><b>Detected Language:</b> <span id="langOutput"></span></p>
        <p><b>Translated English Text:</b></p>
        <p id="translationOutput"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
